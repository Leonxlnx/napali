}
// whole scene: distance + info (w = material: 0 ground/rock, 1 crown, 2 trunk, 3 bush, 4 frond, 5 palm trunk)
float sceneSD(vec3 p, out vec4 inf){
  float h=H(p.xz);
  float sw;
  float d=terrSD(p,h,sw);
  inf=vec4(sw,0.,0.,0.);
  if(gVeg&&p.y-h<ENV){
    float dT0=gDTrue;
    vec4 ti; float dt=uDbgM==22?1e9:treesSD(p,ti,d); if(dt<d){d=dt; inf=ti; dT0=d;}
    vec4 bi; float db=uDbgM==23?1e9:bushSD(p,bi,d); if(db<d){d=db; inf=bi; dT0=d;}
    gDTrue=dT0;
  }
  return d;
}

// ---------------------------------------------------------------- terrain march / shadows
float gWhy=0., gIt=0.;
// Two-level march: cheap heightfield steps far above the vegetation envelope, sphere tracing inside it.
// Steps grow with distance and iteration count so grazing rays along steep slopes always terminate.
float pkDbg(){ return uDbgM>=100?float(uDbgM-100):1.; }   // debug only (dbgm=100+k): LOD of a k x wider view, to inspect far LOD in a zoomed probe
bool march(vec3 ro, vec3 rd, float tmin, float tmax, out float tHit, out vec4 inf){
  float t=tmin;
  // step length scaled by a random factor per pixel, sample and frame: whether a step skips or lands in a thin canopy / relief
  // layer on a steep slope was decided by the camera-relative step sequence, the same for whole bands of pixels, so bands of
  // shadow crawled down the ridges as the camera moved (~0:35); random per ray, the accumulated samples average it instead
  float rj=mix(.7,1.2,hash12(gl_FragCoord.xy*1.37+vec2(fract(uTime*.1)*997.,fract(uTime*.37)*613.)));
  float pk=uTan*2./uRes.y*pkDbg();
  inf=vec4(0);
  float lastD=1e9;
  bool inEnv=false;
  for(int i=uZero;i<1100;i++){
    gIt=float(i);
    if(t>tmax){ gWhy=1.; gEpsM=0.; return false; }
    vec3 p=ro+rd*t;
    float hgt=p.y-H(p.xz);
    if(hgt>ENV){ t+=max((hgt-ENV)*.5*rj,.3+t*.0015); inEnv=false; continue; }
    inEnv=true;
    gPix=t*pk; gVeg=t<uVegRange;
    gEpsM=gPix*(.6+float(i)*.004);
    float d=sceneSD(p,inf);
    float eps=gPix*(.6+float(i)*(inf.w>3.5&&inf.w<4.5?.0015:.004));   // palm fronds: no growing hit tolerance (it fattened the see-through fringes into curtains)
    if(d<eps){   // terrain hits: Newton steps on the true distance to a fixed two pixel footprints off the surface. The scaled-down field
      // stopped short by a view-dependent ~0.5-6 footprints (eps grows with the step count, d shrinks with slope), so on steep
      // canopy the shaded point floated in front of the slope and slid across it as the camera moved: crawling, banded shadows
      float ca=max(dot(smoothNormal(p.xz),-rd),.25), off=gPix*2.; bool above=p.y-hgt>1.;   // not under the sea: a lifted hit left the water test
      for(int k=uZero;k<3;k++){ float g=gDTrue; t+=above&&inf.w<.5&&abs(g)<1e4?clamp((g-off)/ca,-2.,6.):d*.9; d=sceneSD(ro+rd*t,inf); }
      tHit=t; gEpsM=0.; gCarpHit=gCarpIn; return true; }
    t+=max(d*.8*rj,eps*.5);
    lastD=d;
  }
  gWhy=3.; gEpsM=0.;
  if(inEnv){ tHit=t; gWhy=4.; gCarpHit=gCarpIn; return true; }   // budget exhausted inside the vegetation layer: accept (never leave a hole)
  return false;
}
float shadowH(vec3 p, vec3 L){
  float res=1., t=.5;
  for(int i=uZero;i<70;i++){
    vec3 q=p+L*t;
    if(q.y>uHmax) break;
    float d=q.y-H(q.xz);
    res=min(res,10.*d/t);   // (r7 forest) crisper ridge / valley-wall shadow edges (6: very soft, smeared the lit / shaded faces)
    if(res<-.2) break;
    t+=clamp(d*.5,.8,40.);
  }
  return smoothstep(-.2,1.,res);
}
// geometry shadows near (trees, bushes, rock relief), heightfield beyond
float gShStart=.06;
float gShG=1.;   // (r7 forest) the near-geometry part (crowns, bushes, rock relief) of the last shadow() call
float shadow(vec3 p, vec3 L, float range){
  float res=1., t=gShStart;
  gShG=1.;
  if(range>0.){
    float gp=gPix; gPix=max(gPix,.32);   // shadows use the cheap crown LOD
    float kP=mix(13.,10.,smoothstep(.6,1.6,gp));   // (r7 forest) crisp crown shadows close up, a little softer where the crowns are only a few px (no crawling pixel shadows)
    for(int i=uZero;i<48;i++){
      vec3 q=p+L*t;
      vec4 inf; float d=sceneSD(q,inf);
      res=min(res,kP*d/t);   // (r7 forest) crisper crown shadows (9: soft grey penumbrae flattened the canopy)
      if(res<.01){ gPix=gp; gShG=0.; return 0.; }
      t+=clamp(d,.08,3.5);
      if(t>range) break;
    }
    gPix=gp;
  }
  gShG=clamp(res,0.,1.);
  return min(res,shadowH(p+L*t,L));
}

// ---------------------------------------------------------------- ocean surface
float oLod(float L, float pix){ return log2(max(pix*2.6/(L/${OCEAN_N}.),1.)); }
// anti-tiling: cascades 1/2 are also sampled as a shifted, rescaled copy; a slow noise mask blends the two
// (variance-preserving weights), so the 137 m / 20 m tiles never repeat visibly
const vec2 OB_OFF=vec2(.373,.618); const float OB_SC=1.1736;
vec2 oBlendW(vec2 p){ float m=smoothstep(-.32,.32,fbm(p*.0042+vec2(3.1,7.7),2)); vec2 w=vec2(1.-m,m); return w*inversesqrt(dot(w,w)); }
vec2 gSCp=vec2(0);   // position for surfChop (set by the caller)
// surf zone: broken, steep short waves (bores, reflected and refracted chop) -- more short-wave energy where waves break
float surfChop(float depth, float w){ return 1.+1.1*smoothstep(7.,2.,depth)*min(1.,depth*.6)*smoothstep(0.,8.,w)*(1.-.75*smoothstep(.05,.4,VEG(gSCp).b)); }
float shoreGain(float depth, float w){ return mix(.62,1.,smoothstep(1.,12.,depth))*smoothstep(-1.,4.,w)*min(1.,.15+.5*depth); }   // the surf zone stays choppy (but troughs never bare the bed)
// smooth distance to the shore (m) for waves and surf: the traced coast SDF has polygon corners (they showed up
// as zig-zag crests and foam bands); a 7-tap blur (~11 m) rounds them, the noise is the terrain coastline's (coastD)
float coastW(vec2 p){
  // the blur radius grows with the distance from the shore: wave crests far out are smooth arcs (refraction irons out
  // the coastline's small features); a plain distance field has ridges / cusps along its medial axis (the crest
  // lines in the cove interior drew heart-shaped loops)
  float c0=coastRaw(p), r=11.+clamp(-c0-12.,0.,110.)*.5;
  float c=c0*.28+(coastRaw(p+vec2(.955,.295)*r)+coastRaw(p+vec2(.221,.975)*r)+coastRaw(p+vec2(-.734,.68)*r)
         +coastRaw(p-vec2(.955,.295)*r)+coastRaw(p-vec2(.221,.975)*r)+coastRaw(p-vec2(-.734,.68)*r))*.12;
  return -(c+5.*vnoise(p*.035+3.7)+2.2*vnoise(p*.12-1.3));
}
float gShS=1.;   // phase behind the last breaker crest (0 at the crest), set by shoal()
float gShB=0.;   // breaking intensity of the surf zone here (0 .. 1), set by shoal()
float gShFW=0.;   // (r10w) the pixel's extent along the shore distance (m), set by shadeWater around its shoal() call (0: unfiltered)
float gShBrk=0.;   // (r11w) breaking strength of the wave here (0 .. 1), set by shoal()
float gShS0=1., gShLam=38.;   // (r12w) raw phase behind the crest (never footprint-averaged) and wave length, set by shoal()
float gShCv=0.;   // (r11w) sheltered-cove weight (x URL wk19), set by shadeWater around its shoal() call: long, unbroken crest lines
// breaking waves in the shallows: returns (height, d height / d w, foam, crest)
vec4 shoal(vec2 p, float w, float depth){
  gShS=1.; gShB=0.; gShBrk=0.; gShS0=1.;
  if(w>260.||depth<=.02||depth>17.) return vec4(0);
  float lam=34.+8.*vnoise(p*.004), c=4.2;
  float warp=.35*fbm(p*.006+3.,3)+.12*vnoise(p*.03);
  float ph=(w+c*uTime)/lam+warp;
  float s=fract(ph), id=floor(ph); gShS=s; gShS0=s; gShLam=lam;
  float set=.75+.25*sin(6.2831*(uTime/70.+id*.37))+.15*vnoise(p*.01+id);
  // crests are broken into sections along the shore (each wave peaks in a few places, not one ring)
  float sect=smoothstep(-.55,.35,vnoise(p*.022+id*7.31))*.6+.4;
  sect=mix(sect,.88+.12*vnoise(p*.006+id*3.1),gShCv);   // (r11w) in the sheltered cove each wave breaks along most of its crest (the photos' parallel white lines), not in ~45 m sections (white blobs)
  // sheltered water (cove interiors: low wave exposure) gets smaller waves -- they break only close to the shore
  float shel=mix(.6,1.,smoothstep(.4,.75,ATT(p).z));
  float A0=1.5*set*(.6+.4*vnoise(p*.008-4.))*sect*shel;
  float A=A0*clamp(pow(8./max(depth,.4),.25),1.,1.7);
  float brk=smoothstep(.2,.46,A/max(depth,.05)); gShBrk=brk;   // (r4f: softer onset: no solid slab with a cut-out outline where a reef patch crosses the threshold)
  A=min(A,.48*depth+.05);
  A*=smoothstep(260.,140.,w)*smoothstep(.0,.5,w)*smoothstep(17.,8.,depth);
  float cr=.05+.08*(1.-brk);
  float k=3.4;
  float tail=exp(-.94*k);
  float shp=smoothstep(0.,cr,s)*(exp(-(s-cr)*k)-tail)/(1.-tail);
  float dsh=s<cr?(6.*s/cr*(1.-s/cr))/cr:-k*exp(-(s-cr)*k)/(1.-tail);
  float h=A*shp;
  // whitewater: thick on the face just behind the crest, a long thinning trail of residual foam behind it
  // (a dense bore right behind the crest, decaying into lace over ~1/3 of the wave length, clear water before the next)
  gShB=smoothstep(.15,.35,1.5*shel*(.6+.4*vnoise(p*.008-4.))/max(depth,.05))*smoothstep(260.,140.,w)*smoothstep(.0,.5,w)*smoothstep(17.,8.,depth);
  // (over very shallow flats the bore keeps spilling: the whitewater stays dense across most of the wave period)
  float flt=smoothstep(4.,1.8,depth)*(1.-smoothstep(.05,.4,VEG(p).b))*smoothstep(.45,.8,ATT(p).z);   // reef flats (beaches: plunging shore break) (r4f: exposed flats only -- in the sheltered cove the small waves spill in lines, no standing slabs)
  // (r13w, URL wk46) the foam band's leading edge was one smooth isoline of the shore distance (a step from nothing to full white at the
  //  crest): seen from a boat (v3) a straight horizontal seam across the mid-distance water. The foam's phase is jittered along the crest
  //  (~17 m / ~5 m) and each wave's foam breaks into sections with clear gaps (not in the sheltered cove: its long crest lines stay)
  float sF=s, secF=1.;
  if(uWK12.z>0.){ sF=fract(s+uWK12.z*(.05*vnoise(p*.06+vec2(id*2.3,uTime*.04))+.02*vnoise(p*.21+vec2(1.7,id))));
    secF=mix(1.,.25+.75*smoothstep(-.6,.2,vnoise(p*.035+id*vec2(4.1,2.9))),uWK12.z*(1.-gShCv)); }
  float foam=brk*secF*(smoothstep(0.,.12,sF)*exp(-sF*mix(6.5,2.6,flt))*mix(1.8,1.6,flt)+mix(.32,.5,flt)*smoothstep(0.,.08,sF)*exp(-sF*mix(3.6,1.8,flt))*smoothstep(9.,2.,depth));
  float lip=brk*smoothstep(.0,cr,s)*exp(-(s-cr)*14.);
  // (r10w) a footprint longer than ~1/6 of the wave spacing along the shore distance (the far band of the boat views: one row
  //  spans 30-130 m) point-sampled the crest lines -- some rows hit a white crest, the next did not: grey-white dashes. There
  //  the profiles go to their mean over one wave period (exact for the exp profiles), the slope to 0, the phase to .35
  //  (exp(-4 s) of the bores then equals its period mean)
  float fsh=smoothstep(.15,.6,gShFW/lam);
  if(fsh>0.){ float a1=mix(6.5,2.6,flt), a2=mix(3.6,1.8,flt);
    float fm=brk*((1.-exp(-a1))/a1*exp(-.06*a1)*mix(1.8,1.6,flt)+mix(.32,.5,flt)*(1.-exp(-a2))/a2*exp(-.04*a2)*smoothstep(9.,2.,depth));
    foam=mix(foam,fm*mix(1.,.79,uWK12.z*(1.-gShCv)),fsh); lip=mix(lip,brk*.07,fsh); h=mix(h,A*.25,fsh); dsh*=1.-fsh; gShS=mix(s,.35,fsh); }
  return vec4(h,A*dsh/lam,foam,lip);
}
// swash on beaches: after every breaker the bore runs up the sand as a thin sheet (ballistic up-rush, back-wash)
// and drains again. gh = sand height. Returns (sheet thickness, run-up height of this wave, swash phase 0..1).
vec3 swash(vec2 p, float gh){
  if(gh>1.05||gh<-.8) return vec3(0.,0.,1.);
  float bz=VEG(p).b;
  if(bz<.05) return vec3(0.,0.,1.);
  float lam=34.+8.*vnoise(p*.004), c=4.2;                 // same wave train as shoal()
  // (+ ~40 m phase variation: each wave runs up in lobes at slightly different times -> curved, cuspate fronts)
  float warp=.35*fbm(p*.006+3.,3)+.12*vnoise(p*.03)+.05*vnoise(p*.11)+.2*vnoise(p*.024+7.7);
  float ph=c*uTime/lam+warp+.2;
  float s=fract(ph), id=floor(ph);
  float set=.75+.25*sin(6.2831*(uTime/70.+id*.37))+.15*vnoise(p*.01+id);
  // every bore runs up in lobes (each wave its own): the front is a scalloped line, never straight
  float lobe=max(.72+.5*vnoise(p*.045+vec2(id*1.7,id*3.1))+.16*vnoise(p*.16+id*2.3),.15);
  // fast up-rush, slower back-wash (the sheet decelerates uphill, then drains)
  float sr=s<.38?s/.38*.5:.5+(s-.38)/.62*.5;
  float Zr=(.12+.36*set)*lobe*4.*sr*(1.-sr)*(.8+.2*smoothstep(.2,.8,bz));
  float th=clamp((Zr-gh)*.3,0.,.08)*smoothstep(.05,.4,bz);
  return vec3(th,Zr,sr);
}
// ocean height at p (horizontal displacement ignored for the intersection)
float oceanH(vec2 p, float pix, out vec4 sh){
  float bedH=H(p), depth=max(-bedH,0.), w=max(coastW(p),0.);
  float g=shoreGain(depth,w)*uOAmp;
  float gust=.8+.4*fbm(p*.0011+vec2(uTime*.004,0.),3);
  gSCp=p; float g2=smoothstep(-1.,4.,w)*uOAmp*surfChop(depth,w);
  vec2 bw=oBlendW(p);
  float l0=oLod(uOL.x,pix), l1=oLod(uOL.y,pix);
  // choppy waves: the surface seen at p belongs to the water column that started at p - D(p)
  vec2 pl=p-(textureLod(uOD0,p/uOL.x,l0).xz+(textureLod(uOD1,p/uOL.y,l1).xz*bw.x+textureLod(uOD1,p*OB_SC/uOL.y+OB_OFF,l1+.23).xz*bw.y)*gust)*g;
  float h1=textureLod(uOD1,pl/uOL.y,l1).y*bw.x+textureLod(uOD1,pl*OB_SC/uOL.y+OB_OFF,l1+.23).y*bw.y;
  float h=(textureLod(uOD0,pl/uOL.x,l0).y+h1*gust)*g
           +textureLod(uOD2,pl/uOL.z,oLod(uOL.z,pix)).y*gust*g2;
  sh=shoal(p,w,depth);
  float sea=h+sh.x;
  vec3 sw=swash(p,bedH);
  return sw.x>0.?max(sea,bedH+sw.x):sea;
}
float oceanH(vec2 p, float pix){ vec4 sh; return oceanH(p,pix,sh); }
bool waterHit(vec3 ro, vec3 rd, float tmax, out float tw){
  const float MH=4.;   // bound of the surface height: deep troughs of big swell + choppy wind sea reach below -2.6 m
  if(rd.y>=0.&&ro.y>MH) return false;
  float pix0=uTan*2./uRes.y;
  float t0=rd.y<0.?max((ro.y-MH)/-rd.y,0.):0.;
  float t1=rd.y<0.?(ro.y+MH)/-rd.y:tmax;
  t1=min(t1,tmax);
  if(t0>t1) return false;
  if(t0*pix0>1.5){ // far: iterate on the plane
    float t=ro.y/-rd.y;
    for(int i=uZero;i<3;i++){ vec3 p=ro+rd*t; t=(ro.y-oceanH(p.xz,t*pix0))/-rd.y; }
    if(t>tmax) return false;
    tw=t; return true;
  }
  float steps=24., dt=(t1-t0)/steps, t=t0, lf=1.;
  for(int i=uZero;i<24;i++){
    t+=dt;                                    // last sample lands exactly on t1 (thin swash sheets over the sand)
    vec3 p=ro+rd*t;
    float f=p.y-oceanH(p.xz,t*pix0);
    if(f<0.){
      float a=t-dt,b=t;
      for(int k=uZero;k<6;k++){ float m=.5*(a+b); vec3 q=ro+rd*m; if(q.y-oceanH(q.xz,m*pix0)<0.) b=m; else a=m; }
      tw=.5*(a+b); return tw<=tmax;
    }
  }
  // no crossing found inside the slab (only possible for extreme troughs): fall back to the plane iteration -- the
  // sea never has holes (they showed the deep sea floor as grey blobs)
  if(rd.y<0.&&ro.y>0.){
    float t=ro.y/-rd.y;
    for(int i=uZero;i<3;i++){ vec3 p=ro+rd*t; t=(ro.y-oceanH(p.xz,t*pix0))/-rd.y; }
    if(t<=tmax){ tw=t; return true; }
  }
  return false;
}

// ---------------------------------------------------------------- foam texture
// Surf foam = the super-level set {S > th} of a fixed "foam potential" field S, with the threshold th chosen
// from the foam density D so that the mean coverage is exactly C(D) (th = inverse CDF of S, measured once with
// dbgm=42: FOAM_TH). S is built from
//  * A: a warped Voronoi network (~0.9 m cells, stretched along the flow): -distance to its walls, the open
//       water of each cell rounded into a blob; wall width varies along the walls (thick and thin stretches);
//  * B: a finer network (~0.28 m): threads around / holes inside the A walls (old foam: more and bigger holes);
//  * G: bubble-cluster fluff (~10 cm, ~3.5 cm): ragged, bubbly edges;
//  * M: ~15 m patches drawn out along the flow: the foam gathers into swirls and bands, clear veins between.
// Low D: only the highest ridges of S survive -> broken threads and flecks; mid D: a lace of walls; high D: a
// sheet with rounded holes. Edges are anti-aliased exactly (edge width = change of S across the pixel footprint,
// the anisotropic ellipse of grazing views included); octaves below the footprint are replaced by their mean and
// their variance widens the edge, so a fully unresolved pattern returns C(D) itself.
// Returns coverage; fo = (thickness 0..1, foam surface slope xz, brightness).
vec4 gFoamDbg=vec4(0);
// x: distance to the nearest Voronoi wall (2nd pass around the nearest site), yz: its gradient,
// w: distance to the nearest site; dir: unit vector from the site to x; id: cell hash
vec4 vorWall(vec2 x, out vec2 dir, out float id){
  vec2 n=floor(x), f=fract(x), mr=vec2(0), mg=vec2(0); float md=8.;
  for(int j=uZero-1;j<=1;j++) for(int i=uZero-1;i<=1;i++){ vec2 g=vec2(i,j), r=g+hash22(n+g)-f; float d=dot(r,r); if(d<md){ md=d; mr=r; mg=g; } }
  float ed=8.; vec2 eg=vec2(0,1);
  int R=uMG.y>.5?2:1;   // (r10m) URL mg1 = 1: the wall pass searches 5x5 cells around the nearest site (the standard border-distance search; 3x3 can miss
  //  the nearest wall when the jitter is full, a jump along a straight Voronoi edge: the v4 foam seam the water round named)
  for(int j=uZero-R;j<=R;j++) for(int i=uZero-R;i<=R;i++){ vec2 g=mg+vec2(i,j), r=g+hash22(n+g)-f, dr=r-mr;
    if(dot(dr,dr)>1e-5){ vec2 nn=normalize(dr); float e=dot(.5*(mr+r),nn); if(e<ed){ ed=e; eg=-nn; } } }
  id=hash12(n+mg+17.); dir=-mr/max(sqrt(md),1e-4);
  return vec4(ed,eg,sqrt(md));
}
// soft cell interior: min(wall distance, rr - site distance), smoothly -> rounded blobs; returns (value, gradient)
vec3 cellIn(vec4 v, vec2 dir, float rr, float k){
  float a=v.x, b=rr-v.w; vec2 gb=-dir;
  if(b<0.){ b=0.; gb=vec2(0); }                              // junctions beyond rr: foam nodes, never deeper
  // (r10w) continuous across the walls: rr is per cell, so where the blob term b came within k of a wall the two cells met with
  //  different values -- a jump of S along the straight Voronoi wall (the hard straight foam edges near the camera, e.g. the
  //  v4 seam at x ~1040). Over the last .04 before the wall b fades to 0, the value of a foam node (the smooth min is then
  //  -k/4 at the wall from both sides). Target 0, not a + k: most lace walls run between small blobs (b <= 0 there), and a + k
  //  took their thick cores away (v4 lost most of its lace). The hole shapes are unchanged away from the walls; walls between
  //  two big holes get ~.03 cell thicker. URL wk11 (1; 0 = r9f).
  float wtW=mix(1.,smoothstep(0.,.04,a),uWK3.w); b*=wtW; gb*=wtW;
  float h=clamp(.5+.5*(b-a)/k,0.,1.);
  return vec3(mix(b,a,h)-k*h*(1.-h), mix(gb,v.yz,h));
}
// threshold of S for coverage C = 0, 1/8, .. 1 (measured with dbgm=42), for age 0 / .5 / 1
const float FOAM_TH[27]=float[27](
  .13,.060,.018,-.007,-.032,-.061,-.101,-.170,-.756,
  .13,.054,.017,-.005,-.026,-.048,-.091,-.158,-.756,
  .13,.05,.012,-.007,-.026,-.045,-.087,-.15,-.755);
float foamTh(float C, float age){
  float x=clamp(C,0.,1.)*8., ia=clamp(age,0.,1.)*2.;
  int i=min(int(x),7), j=min(int(ia),1); float fx=x-float(i), fa=ia-float(j);
  float t0=mix(FOAM_TH[j*9+i],FOAM_TH[j*9+i+1],fx), t1=mix(FOAM_TH[j*9+9+i],FOAM_TH[j*9+10+i],fx);
  return mix(t0,t1,fa);
}
float gFoamSA=0., gFoamS=0.;   // A component, full foam potential (calibration)
float gFoamSm=0.;   // mean of S (all unresolved components), set by foamS
vec3 gFoamF2=vec3(0);   // optional second pattern frame (direction xy, weight z) for foamTex
float gFoamST=2.3, gFoamST2=2.3;   // stretch of the pattern along the flow (main / second frame)
float gFoamSoft=0.;   // (r10w) extra edge width of the lace threshold (churned surf seen from a boat: soft, bubbly edges)
float gFoamBig=0.;   // (r12w) churned surf seen from a boat: the large-scale patches / coarse lace keep their weight close up (big foam sheets and big clear holes, not a field of 1 m blobs); set by shadeWater
float gFoamCore=0.;   // (r11w) solid whitewater core (the rock collar): no sub-pixel lace holes, full cover, full brightness (set by shadeWater)
float gFoamSK=0.;   // the large-scale part of S (patches M + filaments K), set by foamS
float gFoamAK=0.;   // its edge width over one pixel
vec3 gFoamU=vec3(0);   // optional flow coordinate for the filaments (u, du/dx, du/dz): foam lines follow its isolines
// thresholds of the large-scale part only (patches + lines), measured with dbgm=45
const float FOAM_THK[27]=float[27](
  .14,.065,.015,-.017,-.049,-.084,-.118,-.176,-.75,
  .14,.064,.015,-.016,-.048,-.083,-.118,-.177,-.75,
  .14,.063,.013,-.018,-.049,-.085,-.124,-.18,-.75);
float foamThK(float C, float age){
  float x=clamp(C,0.,1.)*8., ia=clamp(age,0.,1.)*2.;
  int i=min(int(x),7), j=min(int(ia),1); float fx=x-float(i), fa=ia-float(j);
  float t0=mix(FOAM_THK[j*9+i],FOAM_THK[j*9+i+1],fx), t1=mix(FOAM_THK[j*9+9+i],FOAM_THK[j*9+10+i],fx);
  return mix(t0,t1,fa);
}
float foamS(vec2 p, vec2 gx, vec2 gy, float age, vec2 fd, out vec2 gS, out vec4 aux){
  vec2 fn=vec2(-fd.y,fd.x);
  float ST=gFoamST;                                           // cells / threads stretched along the flow
  vec2 fa=vec2(dot(gx,fd)/ST,dot(gx,fn)), fb=vec2(dot(gy,fd)/ST,dot(gy,fn));   // pixel footprint in pattern space
  // octave fade-out: geometric mean of the footprint axes (anisotropic filtering, ratio <= 4), not the major
  // axis -- at grazing views the fine lace stays (compressed, exactly anti-aliased per pixel) instead of vanishing
  float pmj=max(max(length(fa),length(fb)),1e-4), pmn=max(min(length(fa),length(fb)),1e-4);
  float pa=min(pmj,sqrt(pmj*max(pmn,pmj*.0625))*1.25);
  vec2 q=p+vec2(uTime*.11,uTime*.04);
  // fine octaves (B, bubbles): nearly unwarped coordinates -- a strong domain warp stretches them into smears

  vec2 af=vec2(dot(qf,fd)/1.25,dot(qf,fn));

  vec2 a=vec2(dot(q,fd)/ST,dot(q,fn));
  a+=vec2(vnoise(a*.33+1.7),vnoise(a*.33+8.3))*1.3;           // ~3 m wobble

  float fA0=fA;
  if(fA>0.) a+=vec2(vnoise(a*2.+5.5),vnoise(a*2.+1.9))*.14*fA;   // ~0.5 m wobble: wavy, never straight walls
  // M: patches / bands
  vec3 m=fbmd(a*vec2(.12,.08)+vec2(3.1,7.3),3);

  float lw=1.-mix(.5,.78,age)*fA0*(1.-gFoamBig);                            // old foam close up: the lace network dominates (threads)                                         // large-scale weight: less once the lace is resolved

    vec3 e=cellIn(v,dr,(.38+.2*id),.1);

    vec3 e=cellIn(v,dr,(.22+.42*id*id)*(1.+lob),.12);       // hole sizes: many small, a few large
    // shallow cells fill up first as the foam thickens: dense whitewater keeps only some (irregular) holes

    float an=mix(2.3,1.,abs(dr.y));                           // walls across the flow are thinner: lace drawn out into streaks
    // (r10w) ... but dr belongs to this cell's site: on a wall the two cells used different an, and the wall core (e.x -k/4,
    //  equal from both sides) was scaled x1 on one side and up to x2.3 on the other -- a straight step of S along the wall,
    //  the v4 seam (x ~1042, y 845-870). Within .12 of the wall an fades to the shared 1.65.
    an=mix(an,mix(1.65,an,smoothstep(0.,.12,v.x)),uWK3.w);
    // (r9w: by the site-to-point direction dr, continuous inside the cell; the nearest wall's normal v.z switched on the
    //  bisector lines between two walls, a jump of S up to x2.3 -- the hard straight foam edges near the camera, e.g. v4 x~1038)
    SA=-e.x*cA*ivA*an; gFoamSA=SA; S+=mix(mA,SA,fA); g+=-e.yz*ivA*an*fA;
  } else S+=mA;

  // sparse foam stays a web of thin connected lines instead of breaking into blobs

  float hw=smoothstep(-.14,-.03,mix(-.3,SA,fA));
  float wB=mix(.03,.015,age);
  float mB=.012;                                              // measured mean (dbgm=43)
  if(fB>0.){
    vec2 dr; float id; vec4 v=vorWall(af/cB+vec2(5.1,2.3),dr,id);
    float lobB=vnoise(dr*2.1+id*23.)*.5;
    vec3 e=cellIn(v,dr,(.15+.45*id*id)*(1.+lobB),.1);
    float hB=hw*mix(.3,1.,age)*step(.35,fract(id*5.17));   // fine holes: mostly in ageing foam, not in every cell
    float sb=kB*(wB-e.x*cB); sb=sb<0.?sb*hB:sb*.6;

  } else S+=mB;
  var+=kB*kB*.0012*(1.-fB*fB);

  vec3 g1=fG1>0.?vnoised(af*10.+vec2(1.3,9.1)):vec3(0), g2=fG2>0.?vnoised(af*28.+vec2(4.7,2.9)):vec3(0);
  float kG=mix(.05,.035,age);
  S+=(g1.x*fG1+g2.x*.55*fG2)*kG; g+=(g1.yz*10.*fG1+g2.yz*28.*.55*fG2)*kG;
  var+=kG*kG*.2*((1.-fG1*fG1)+.3*(1.-fG2*fG2));
  // aux: (edge width of the threshold transition, resolved fractions of the lace (A) and the lines (K), footprint)
  float aa=length(vec2(dot(g,fa),dot(g,fb)));
  gS=fd*(g.x/ST)+fn*g.y;                                      // pattern-space gradient back to world space
  // (r8f) + a fringe of ~6 cm in world units: up close a foam edge is a gradient of thinning bubbles, not a 1-px cut-out
  //  (the cel-shaded flakes of the boat views); from ~40 m on the pixel footprint dominates again, the aerial views do not change
  aux=vec4(sqrt(.002*.002+pow(.7*aa,2.)+var*.25+pow(length(gS)*.06,2.)),fA,fK,pa);   // unresolved variance widens the edge only a little: crisp foam (small coverage bias)
  gFoamDbg.w=g1.x*fG1;
  gFoamSm=mA+mB+(mK+mH)*lw;
  return S;
}
float foamTex(vec2 p, vec2 gx, vec2 gy, float D, float age, vec2 fd, out vec4 fo){
  fo=vec4(0.,0.,0.,1.);
  if(D<=.004) return 0.;
  vec2 gS; vec4 aux;
  float S=foamS(p,gx,gy,age,fd,gS,aux);
  // second pattern frame (e.g. aligned with a beach): blended in where gFoamF2.z > 0 (fixed frames never shear)
  if(gFoamF2.z>.001){
    float sk=gFoamSK, ak=gFoamAK, sm=gFoamSm;
    float st0=gFoamST; gFoamST=gFoamST2;
    vec2 gS2; vec4 aux2; float S2=foamS(p,gx,gy,age,gFoamF2.xy,gS2,aux2);
    gFoamST=st0;
    float wf=gFoamF2.z;

    gFoamSK=mix(sk,gFoamSK,wf); gFoamAK=mix(ak,gFoamAK,wf); gFoamSm=mix(sm,gFoamSm,wf);
  }
  gFoamS=S;
  // target coverage from the density: D .1 -> ~5 %, .3 -> 18 %, .6 -> 45 %, 1 -> 75 %, 1.4 -> 92 %
  // (seen from the air even the densest whitewater keeps some dark holes / gaps: max coverage lower there)
  float C=clamp(1.-exp(-D*D*1.3-D*.35),0.,mix(mix(.78,.95,aux.y),.985,gFoamCore))*mix(1.,.9,age);   // (r11w: the rock collar core is solid white from the air too)   // (r9w: aerial max .86 -> .78: dense foam keeps more dark holes from the air -- lace, not flat white blobs)
  float Cv=C;                                                  // mean coverage wanted
  // three levels of detail, each with its own measured threshold: all octaves (lace), lines + patches only
  // (seen from the air), patches only (far: the exact mean coverage C, modulated by the large patches)
  float fr=1.-age;
  float th=foamTh(C,age), s=aux.x;
  float thK=foamThK(C,age);
  // the two resolved levels are blended as signed distances to their thresholds, then thresholded once:
  // one crisp edge through the LOD transition (blending two coverages would give grey double images)
  float dS=mix(gFoamSK-thK,S-th,aux.y), sS=mix(gFoamAK*2.1,s,aux.y)+gFoamSoft;   // (r8w: K edge 1.5 -> 2.1 x its footprint change: soft outlines from the air, no paper cut-out edges)
  float cov=smoothstep(-sS,sS,dS);

  // thickens into solid white toward the core of each foam patch
  cov*=mix(mix(.55,.65,fr)+mix(.45,.35,fr)*smoothstep(0.,.14+.12*age,dS),1.,max(aux.y,gFoamCore));   // (r8w: ramp .07+.05age -> .14+.12age, .6/.7 -> .55/.65: only the cores of the patches are solid white, the rest a lace veil -- no flat paper cut-outs from the air)
  // lace below the pixel (aerial views): a crisp outline, but inside it the foam is a sub-pixel lace -- partial
  // cover that thickens into solid white toward the core of each foam patch / line
  float x0=.5-sin(asin(1.-2.*C)/3.);                          // inverse smoothstep
  float covU=smoothstep(0.,1.,x0+(S-gFoamSm)*2.5);
  cov=mix(covU,cov,aux.z);
  // (r8w) ageing foam seen from the air (its lace below the pixel): a veil with blue holes and threads (~2-5 m) inside
  // the outline instead of a flat white paper cut-out; gone once the lace itself is resolved (aux.y) or beyond ~2 m pixels
  { float lf=clamp(2.2-aux.w*1.1,0.,1.)*(1.-aux.y)*smoothstep(.25,.75,age)*(1.-gFoamCore);
    if(lf>0.){ vec2 pq=p+vec2(uTime*.11,uTime*.04);
      float ln=vnoise(pq*.33+vec2(4.1,7.3))*.65+vnoise(pq*.6+1.7)*.35*clamp(2.-aux.w*2.,0.,1.);
      cov*=1.-lf*.5*smoothstep(-.1,.5,ln); } }

  float fD=clamp(2.5-aux.w*40.,0.,1.);

    vec2 dr; float id; vec4 v=vorWall(p/.1+vec2(7.3,1.1),dr,id);
    float r=.07+.16*hash11(id*41.3)*hash11(id*7.9), aD=aux.w/.1*1.2+.02;   // mostly tiny, a few bigger
    float pr=smoothstep(-.12,-.01,dS)*(.1+.25*fr)*smoothstep(.05,.3,C);
    float bub=(1.-smoothstep(r-aD,r+aD,v.w))*step(hash11(id*17.9),pr)*fD;
    cov=max(cov,bub*.95);

  fo.x=mix(1.,tkF,aux.y);

  float rim=smoothstep(th-s,th+s+.08,S)*(1.-smoothstep(th+s,th+s+.1,S));
  fo.yz=gS*(rim*.35+.15*(.4+.6*fr))*clamp(1.5-aux.w*2.,0.,1.);

  fo.w=(.85+.15*fr)*(1.-.1*(.5-.5*gFoamDbg.w)*fo.x)*mix(.72,1.,smoothstep(thK,thK+.18,gFoamSK));   // thin / edge foam greyer, thick cores bright (tonal texture from the air)
  fo.w=mix(fo.w,1.,gFoamCore*.85);   // (r11w) the collar core: brilliant white, no grey edge tone
  return cov*smoothstep(0.,.05,D);
}
float foamPattern(vec2 p, float pix, float D){ vec4 fo; return foamTex(p,vec2(pix,0.),vec2(0.,pix),D,.5,normalize(uShore+vec2(1e-4)),fo); }

// ---------------------------------------------------------------- materials
// land lighting (kept separate from SUN / skyIrr, which the water shading is tuned to)
const vec3 SUNL=vec3(1.0,.93,.8)*4.4;                 // warm golden tropical sun
vec3 skyFill(vec3 N, float veg){                       // sky + bounce irradiance: teal fill over forest, blue-grey on sea cliffs
  // a face turned sideways sees about half the sky (the other half is terrain / neighbouring crowns): no bright rims
  vec3 up=mix(vec3(.22,.37,.52),vec3(.19,.40,.36),veg), hor=mix(vec3(.19,.18,.165),vec3(.15,.26,.20),veg), gnd=mix(vec3(.05,.05,.05),vec3(.05,.065,.04),veg);

vec3 sceneNormal(vec3 p, float eps){
  const vec2 k=vec2(1,-1); vec4 i;
  return normalize(k.xyy*sceneSD(p+k.xyy*eps,i)+k.yyx*sceneSD(p+k.yyx*eps,i)+k.yxy*sceneSD(p+k.yxy*eps,i)+k.xxx*sceneSD(p+k.xxx*eps,i));
}
float sceneAO(vec3 p, vec3 n, float s){
  float o=0., w=1.; vec4 i;
  for(int k=uZero;k<5;k++){ float h=s*(.12+.5*float(k*k)); float d=sceneSD(p+n*h,i); o+=max(h-d,0.)*w/h; w*=.75; }
  return clamp(1.-o*.32,0.,1.);
}
float gRkSea=1.;                                       // 1 = seaward, iron-stained red-brown faces; 0 = inland grey basalt walls

// - lava-flow scale lithology (25-80 m): dense charcoal flows, weathered brown flows, iron-stained red-brown sections;
// - weathering skin on the proud blocks (oxidised brown / orange / red-brown), recessed blocks stay sooty dark;
//   every block has its own shade, a few fresh grey breaks;
// - facet orientation: red-brown laterite / soil and some dark moss film on ledge tops;
// - open joints between the wall columns (rkSlots) darken as slots; mottle, grain and lichen only while resolved

  float fsk=clamp(5./(gp*5.)-1.,0.,1.);
  if(fsk>0.){ float vs=noise3(vec3(p.x*.2,p.y*.03,p.z*.2)+41.)+.5*noise3(vec3(p.x*.55,p.y*.08,p.z*.55)+3.)*clamp(2./(gp*5.)-1.,0.,1.);
    c*=mix(1.,.5+.65*smoothstep(-.6,.5,vs),fsk*gRkS10*(1.-.5*up)); }
  // open joints between the columns of the walls: dark slots (shading only, band-limited in rkSlots)
  if(gRkSl>.01){
    vec3 q=p+vec3(noise3(p*.021+1.3),noise3(p*.017+4.2)*.6,noise3(p*.021+7.1))*6.;
    c*=1.-.8*rkSlots(q,gp)*gRkSl*(1.-up);
  }
  // weathering mottle (1-4 m) and grain (.2-.6 m), only while resolved (footprint fades)
  float fm=clamp(1.6-gp*1.8,0.,1.), ff=clamp(1.5-gp*6.,0.,1.), fg=clamp(1.4-gp*14.,0.,1.);
  c*=1.+(.18*noise3(p*.45+4.)+.12*noise3(p*1.3+9.)*ff)*fm+.16*noise3(p*4.1+2.)*fg;
  // lichen / salt crust: pale grey patches on dry, upper rock (resolved only)
  float lc=noise3(p*.35+5.)+.4*noise3(p*1.1+2.)*ff;
  c=mix(c,lichen,smoothstep(.5,1.,lc)*(1.-spray)*.16*fm*smoothstep(6.,25.,p.y));
  // inland walls: grey basalt, dark wet seeps and moss / algae stains down the face (no red cast)
  float lum=dot(c,vec3(.3,.5,.2));
  // (r12 walls) uWA.x (URL wa0): the inland basalt is a warm dark brown-grey, not a neutral grey: under the blue sky fill of the
  //  gully shade the neutral grey read as slate blue-grey patches on the v1 / v9 ridges (photos: near-black basalt in the shade,
  //  brown-grey in the sun). uWA.z (URL wa2): darker inland basalt
  float wA=uWA.x*mix(.25,1.,aer);   // seen level (v4 / v5 inland cliffs: dark grey basalt in the photos) only a touch
  vec3 cin=mix(vec3(lum)*mix(vec3(.95,.97,.95),vec3(1.2,.97,.7),wA),c,.35+.15*wA)*.85*(1.-.5*uWA.z);
  float ms=smoothstep(.1,.8,noise3(vec3(p.x*.09,p.y*.025,p.z*.09)+31.)+.3*noise3(p*.3+3.));
  cin=mix(cin,vec3(.026,.034,.02)*(1.-.25*uWA.z),ms*.6);
  // (r12 walls) uWA.y (URL wa1): red-brown soil / laterite scars on the inland walls (ref.png ridges, r5 right wall): ragged
  //  40-120 m patches on the less sheer faces, strongest from the air
  float scR=uWA.y*smoothstep(.2,.7,noise3(vec3(p.x*.012,p.y*.02,p.z*.012)+51.)+.45*noise3(p*.05+9.)+.25*noise3(p*.17+2.)*fm)*(1.-.6*sheer)*(1.-spray);
  cin=mix(cin,mix(redb,ochre,.25)*(.7+.5*t1),scR*mix(.12,.9,aer));
  c=mix(cin,c,gRkSea);
  return mix(c,c*vec3(.62,.62,.66),spray);
}
// (r13 mat) fractured, jointed basalt at mid / long range (shading only). The relief octaves of rockField fade out below ~5 px,
//  so from the air (footprint ~.8-1 m: v1 / v9 headlands) and on the far walls the rock read as smooth brown clay with soft
//  blobs; the photos show crisp fracture: columns and blocks with lit and shaded facets and near-black open joints between them.
//  The columns of a lava flow are vertical prisms: 2D jittered cells in xz (seen on a steep face as vertical strips of uneven
//  width), each column broken by cross joints into segments 1-3 columns tall. Every segment is a planar facet with its own turn
//  about the vertical and lean in / out (lit and shaded facets side by side), the face of each column rounds off toward its
//  joints, and the joints are open cracks (dark). Three fixed scales (2.8 / 7 / 17 m), each faded once its columns span fewer
//  than ~4-8 px (no shimmer, no morphing octaves); a crack narrower than ~1 px fades to its mean darkening. Steep faces only:
//  on gentle ground the cells would read as paving.
vec4 rkCol(vec2 q, float cs, float sd){   // x = F2-F1 (m), y = id, zw = p - cell centre (m)
  vec2 g=q/cs, n=floor(g), f=fract(g);
  float d1=9., d2=9., id=0.; vec2 b=vec2(0);
  for(int k=uZero;k<9;k++){
    vec2 o=vec2(k%3,k/3)-1.;
    vec3 h=rkHash(vec3(n+o,sd));
    vec2 r=o+.12+.76*h.xy-f;
    float d=dot(r,r);
    if(d<d1){ d2=d1; d1=d; b=r; id=h.z; } else if(d<d2) d2=d;
  }
  return vec4((sqrt(d2)-sqrt(d1))*cs,id,-b*cs);
}
float gFrCav=0., gFrWt=0., gFrUp=0., gFrTn=1.;   // last rkFracture call: open-joint darkness, weathered (oxidised) share, facet lean (+ up), segment tone
void rkFracture(vec3 p, vec3 Nf, inout vec3 N, float w){   // Nf: smooth face normal (~4 m)
  gFrCav=0.; gFrWt=0.; gFrUp=0.; gFrTn=1.;
  if(w<=.001) return;
  float gp=max(gPix*gRkAn,1e-4);
  float stp=smoothstep(.82,.5,Nf.y);
  if(stp<=0.) return;
  vec2 wq=p.xz+vec2(noise3(p*.043+3.1),noise3(p*.043+8.7))*4.;   // the joints wander (~25 m)
  vec3 tH=normalize(vec3(-Nf.z,0.,Nf.x)+vec3(1e-5,0.,0.));        // along the face, horizontal
  vec3 dn=vec3(0); float cav=0., tn=0., wt=0., ws=0.;
  for(int s=uZero;s<3;s++){
    float cs=s==0?2.8:(s==1?7.:17.);
    float fw=clamp(cs/(gp*4.)-1.,0.,1.)*stp;
    if(fw<=0.) continue;
    vec4 c=rkCol(wq+float(s)*37.3,cs,float(91+s*7));
    float segL=cs*mix(.9,2.6,fract(c.y*7.31));                       // cross-joint spacing of this column
    float sv=p.y/segL+c.y*5.7+noise3(p*(.6/cs)+float(s))*.25, sf=fract(sv);
    vec3 h=rkHash(vec3(floor(c.y*65536.),floor(sv),float(s)+5.));
    // facet: turn about the vertical (+-.6) and lean in / out (+-.35), the column face rounding off toward its joints
    float side=clamp(dot(vec2(tH.x,tH.z),c.zw)/(cs*.5),-1.,1.);
    float lean=(h.y*2.-1.)*.35+.12;
    vec3 tl=tH*((h.x*2.-1.)*.6+side*.45)+vec3(0.,lean,0.);
    float amp=s==0?.55:(s==1?.75:.6);
    dn+=(tl-Nf*dot(tl,Nf))*amp*fw;
    // open joints between the columns and at the cross joints (crack width .05-.12 of the column)
    float jw=mix(.05,.12,h.z)*cs;
    float vis=clamp(jw/gp*1.2-.3,0.,1.);
    float ed=min(c.x*.5,min(sf,1.-sf)*segL*.8);
    float cr=(1.-smoothstep(jw*.35,jw+gp*.7,ed))*vis+(1.-vis)*min(2.2*jw/cs,1.)*.8;
    float op=smoothstep(-.05,.4,noise3(p*(1.6/cs)+float(s)*17.)+.3*(fract(h.z*13.1)-.5));   // a joint is open over parts of its length only (no crackle net)
    cav=max(cav,cr*fw*op);
    tn+=(h.z-.5)*fw; wt+=smoothstep(.35,.75,h.x*.6+h.y*.4+.25*lean+.45*smoothstep(.25,.7,Nf.y)-.2)*fw; gFrUp+=lean*fw; ws+=fw;   // sloping faces hold the oxidised crust / laterite (ref.png: red-brown on the sloping crest faces), sheer faces are fresher dark basalt (r9 sea cliffs)
  }
  N=normalize(N+dn*w);
  { float dd=dot(N,Nf); if(dd<.45) N=normalize(N+Nf*(.45-dd)); }   // a facet never turns away from the face
  gFrCav=cav*w;
  gFrWt=ws>0.?wt/ws*min(ws,1.)*w:0.;
  gFrUp=ws>0.?gFrUp/ws*min(ws,1.):0.;
  gFrTn=1.+tn/max(ws,1.)*.7*w;
}
// 3D crown cells: x=F1 (0..), y=F2-F1, z=id
vec3 gCrownOff;   // offset from the nearest crown centre (cell units)
vec3 voronoi3c(vec3 p, float cs){
  vec3 g=p/cs, n=floor(g), f=fract(g);
  float d1=8., d2=8., id=0.; gCrownOff=vec3(0);
  for(int k=uZero;k<27;k++){
    vec3 o=vec3(k%3,(k/3)%3,k/9)-1.;
    vec3 c=n+o; vec3 r=o+hash33(c)-f;
    float d=dot(r,r);
    if(d<d1){ d2=d1; d1=d; id=hash13(c*1.7+3.); gCrownOff=-r; } else if(d<d2) d2=d;
  }
  return vec3(sqrt(d1),sqrt(d2)-sqrt(d1),id);
}
// per-leaf facets: nearest jittered cell -> (random normal xyz, tone w)
vec4 leafFacet(vec3 p, float size){
  vec3 g=p/size, n=floor(g), f=fract(g);
  float bd=8., bd2=8.; vec3 bc=vec3(0);
  for(int k=uZero;k<8;k++){
    vec3 o=vec3(k&1,(k>>1)&1,(k>>2)&1)-.5+step(.5,f)-.5;
    vec3 c=n+o+.5;
    vec3 r=c-.5+hash33(c)-g;
    float d=dot(r,r);
    if(d<bd){ bd2=bd; bd=d; bc=c; } else if(d<bd2) bd2=d;
  }
  vec3 h=hash33(bc*1.37+3.1)*2.-1.;
  float edge=smoothstep(0.,.35,sqrt(bd2)-sqrt(bd));            // dark slivers between leaves
  return vec4(h,hash13(bc*.71+9.3)*mix(.25,1.,edge));
}
// (r5) band-limited leaf / tuft speckle at every distance: the facet size follows the pixel footprint in octaves (never
// below ~4 px: no sparkle, cross-faded between octaves), so foliage keeps a fine-grained leafy light structure (lit and
// shaded tufts) instead of smooth clay. x,y,z = random tilt, w = tone
vec4 facetCell(vec3 p, float size){
  vec3 g=p/size, n=floor(g), f=fract(g);
  float bd=8., bd2=8.; vec3 bc=vec3(0);
  for(int k=uZero;k<8;k++){
    vec3 o=vec3(k&1,(k>>1)&1,(k>>2)&1)+step(.5,f)-1.;
    vec3 c=n+o;
    vec3 r=o+.2+.6*hash33(c+11.)-f;
    float d=dot(r,r);
    if(d<bd){ bd2=bd; bd=d; bc=c; } else if(d<bd2) bd2=d;
  }
  vec3 h=hash33(bc*1.37+3.1)*2.-1.;
  float edge=smoothstep(0.,.6,sqrt(bd2)-sqrt(bd));
  return vec4(h,hash13(bc*.71+9.3)*mix(.6,1.,edge));
}
void leafSpeckle(vec3 p, inout vec3 N, inout vec3 alb, float w){
  if(w<=.001) return;
  float kf=log2(max(6.*gPix/.12,1.)), k0=floor(kf), fk=smoothstep(.35,1.,fract(kf));   // facets 3-6 px (4*gPix = 2-4 px added per-pixel grain: photos are softer at the pixel level)
  float s0=.12*exp2(k0);
  vec4 a=facetCell(p,s0);
  if(fk>0.) a=mix(a,facetCell(p+5.3,s0*2.),fk);
  vec3 tn=a.xyz-N*dot(N,a.xyz);
  float fa=mix(1.,uVC.y,smoothstep(.35,1.1,gPix));   // (r11 veg) uVC.y (URL vc1, .5)   // (r7 forest) from the air: half the speckle (1-3 px energy 1.7-1.9x the photos', it broke the lit faces into grey noise)
  N=normalize(N+tn*.55*w*mix(1.,.8,smoothstep(.35,1.1,gPix)));
  alb*=mix(1.,.6+1.*a.w,w*fa);   // (r5: ~mean-preserving: the speckle shapes the light, it does not darken the canopy)
}
// species palettes (linear albedo), calibrated on the reference photos
vec3 forestTone(float k){
  return k<.22?vec3(.020,.036,.014):   // deep blue-green (mango, java plum, ohia)
         k<.42?vec3(.034,.052,.013):   // mid green
         k<.58?vec3(.050,.058,.012):   // olive green
         k<.74?vec3(.054,.066,.015):   // yellow-green (hau, guava)
         k<.84?vec3(.064,.074,.021):   // bright yellow-green (albizia, fresh flush)
         k<.94?vec3(.048,.062,.044):   // pale silvery grey-green (kukui)
         k<.985?vec3(.058,.056,.020):  // olive-bronze ((r7 forest) rarer, less orange)
               vec3(.060,.046,.024);   // reddish-bronze new growth
}
vec3 shrubTone(float k){
  return k<.25?vec3(.060,.083,.019):   // uluhe fern, yellow-green (sunlit fern slopes: the lime patches of r9)   ((r8 forest) .066,.092,.018: lit fern slopes read neon from the air)
         k<.48?vec3(.058,.064,.021):   // grass / sedge, straw-yellow
         k<.76?vec3(.050,.060,.016):   // olive shrubs
         k<.985?vec3(.030,.044,.014):  // dark shrubs
               vec3(.066,.052,.025);   // dried fern (rust) ((r7 forest) rarer: orange specks from the air)
}
// species choice: about half of the crowns follow the local grove's species, the rest are random
float speciesK(float id, vec3 p){
  float grove=noise3(p*.013+5.7)*.5+.5;
  return fract(id*3.71)<.45?fract(grove*1.9+.3):fract(id*7.31);
}
vec3 leafColor(float seed, vec3 p, float hgt){
  float k=fract(seed*7.31);
  vec3 c=k<.26?vec3(.040,.056,.022):        // deep green (mango, ohia)
         k<.50?vec3(.072,.088,.034):        // mid olive
         k<.66?vec3(.115,.125,.046):        // sunlit olive / kukui
         k<.78?vec3(.135,.140,.045):        // yellow-green (hau, guava)
         k<.88?vec3(.058,.074,.04):         // grey-olive
         k<.95?vec3(.050,.066,.030):        // dark olive
               vec3(.10,.085,.04);          // dry / bronze new growth
  c*=.85+.3*fract(seed*13.7);
  float f1=clamp(1.-gPix*3.,0.,1.), f2=clamp(1.-gPix*10.,0.,1.);
  c*=1.+.22*noise3(p*.7+seed*11.)+.3*noise3(p*4.+seed*3.)*f1+.35*noise3(p*13.)*f2;
  // leaf clusters: lit clumps with dark gaps between them
  c*=mix(1.,mix(.3,1.15,smoothstep(-.35,.35,noise3(p*2.6+seed*5.))),f1*.85);
  c*=.82+.36*hgt;
  if(fract(seed*3.3)>.93) c=mix(c,vec3(.23,.03,.02),smoothstep(.72,.85,noise3(p*5.))*f1*.8);   // ohia blossoms
  return c;
}
// tree / bush foliage albedo: species tone, cluster / spray / leaf variation and baked canopy occlusion
// (uses the shading hints g* of the crown that was evaluated last)
// instanced tree albedo by species (treeType in v3_geo), slight per-tree and per-grove shifts
vec3 treeTone(float seed, vec3 pos){
  float ty=treeType(seed), v=fract(seed*13.7);
  vec3 c=ty==0.?mix(vec3(.018,.032,.013),vec3(.028,.044,.015),v):   // mango, java plum: deep glossy (blue-)green
         ty==1.?mix(vec3(.032,.048,.015),vec3(.044,.060,.017),v):   // mid green
         ty==2.?mix(vec3(.050,.062,.019),vec3(.064,.074,.022),v):   // albizia / monkeypod: light yellow-green
         ty==3.?mix(vec3(.042,.058,.042),vec3(.054,.070,.052),v):   // (bluish before the warm FOLG balance: stays silvery)   // kukui: pale silvery grey-green
                mix(vec3(.046,.058,.015),vec3(.060,.070,.017),v);   // hau / guava: yellow-green
  if(fract(seed*23.1)>.975) c=mix(vec3(.050,.050,.022),vec3(.056,.050,.028),v);   // olive-bronze new flush
  float grove=noise3(pos*.012+2.3);
  c*=mix(.9,1.,smoothstep(.15,.6,gPix));                     // close up the broadleaf crowns are deep glossy green (r5), not lime
  float vt=fract(seed*29.3); c*=mix(.8+.4*vt,.66+.44*vt,smoothstep(.3,.9,gPix));   // (r8 forest) .6+.75vt^2: pale crowns among dark ones read as separate balls from the air   // tree to tree: many greens, light and dark crowns side by side (strongest from the air)
  c*=mix(vec3(1.),grove>0.?vec3(1.08,1.06,.92):vec3(.92,.96,1.06),abs(grove)*.8);
  float sv=fract(seed*41.7);   // (r7 forest) tree to tree chroma: greyish crowns beside saturated deep-green / lime ones (from the air)
  c=max(mix(vec3(dot(c,vec3(.3,.6,.1))),c,mix(1.,.9+.3*sv,smoothstep(.25,.8,gPix))),0.);   // (r8 forest) .78+.55sv: fewer grey-olive crowns
  return c*mix(vec3(1.),mix(vec3(.84,.97,1.06),vec3(.9,.96,.98),uVE.y)*.77,smoothstep(.3,.9,gPix));   // (r11 veg) uVE.y (URL ve1): less of the emerald (blue) push on the crowns from the air: lime-emerald gorge floor (v1 floor h122 vs photo 117)   // (r8 forest) closed forest from the air: deep emerald, not olive (ref.png valley 0.25-0.5 band h153, ours h132)
}
// leaf-scale light variation on foliage surfaces: tufts (~.36 m) and leaves, each with its own tilt (normal)
// and tone, dark slivers between them. Each level fades out below ~2 px (band-limited, no sparkle).
void leafyShade(vec3 p, inout vec3 N, inout vec3 alb, float leafS, float w){
  // only where the leaves are not real geometry (gLeafW): the facets stand in for them
  float fT=lodF(.36)*w*(1.-gLeafW), fL=lodF(leafS)*w*(1.-gLeafW);
  if(fT>0.){ vec4 a=leafFacet(p,.36); N=normalize(N+a.xyz*.35*fT); alb*=mix(1.,.62+.7*a.w,fT); }
  if(fL>0.){ vec4 b=leafFacet(p+3.1,leafS); N=normalize(N+b.xyz*.8*fL); alb*=mix(1.,.5+.95*b.w,fL); }
  alb*=mix(.94,1.,lodF(.36));                          // unresolved leaves self-shadow: darker average
}
// unresolved leaf clusters: bump the normal and darken the gaps (shading only); weight w fades each scale in where the
// geometry no longer resolves it and out below ~2 px
void clusterBumps(vec3 p, inout vec3 N, inout float tone, float cs, float h, float w){
  if(w<=.001) return;
  vec4 b=domeG(p+noised3(p*(.6/cs)).yzw*cs*.25+noised3(p*(1.7/cs)+4.1).yzw*cs*.16,cs);   // warped: irregular clusters, no rings (r5: + a finer warp: lobed, ragged clump outlines, not round pebbles)
  vec3 g=b.yzw-N*dot(N,b.yzw);
  N=normalize(N-g*h*cs*w);
  // (r5) no dark outline all round every clump (pebbles): a shallow gap darkening, plus the clump's own shadow on its
  // side away from the sun (the dome rises toward the sun from here): lit tops toward the sun, dark sides trailing away
  float su=dot(b.yzw,uSun)*cs;
  tone*=mix(1.,(.78+.32*b.x)*(1.-.4*smoothstep(.1,1.6,su)),w);
}
// (r9 side) canopy seen level at mid / long range (footprint ~.3-4 m): the unresolved crowns on the walls, each a lit cap with a
// shaded underside and dark gaps between them (r2 / r3 / r5 walls; the aerial carpet LOD reads as smooth moss from the side).
// Shading only, on warped 3D cells whose size follows the footprint in octaves (>= ~6 px per crown, cross-faded: no shimmer).
// Crowns of varied size (.55-1 cell) and tone, overlapping (max of the domes), some cells empty (gaps): organic, not scales.
void sideCrown1(vec3 p, inout vec3 N, inout float tone, float cs, float w){
  vec3 q=(p+noised3(p*(.45/cs)+2.9).yzw*cs*.3)/cs, n=floor(q), f=fract(q);
  float best=0., kb=1., cid=.5; vec3 rb=vec3(0,1,0);
  for(int k=uZero;k<8;k++){
    vec3 o=vec3(k&1,(k>>1)&1,(k>>2)&1)+step(.5,f)-1.;
    vec3 h=hash33(n+o+8.9);
    if(h.z<.2) continue;                                       // gap (r9f: .14 -> .2)
    vec3 r=o+.2+.6*h-f;
    float kr=mix(.55,1.,h.x);                                  // (r9f: tried .42-1 (squared): crowns under ~2 px radius at the finest octave could shimmer -- kept .55-1)   // reach <= .67 cell: the 2x2x2 search never cuts a dome
    float s=1.-dot(r,r)*2.2/(kr*kr);
    if(s>best){ best=s; rb=r; kb=kr; cid=h.y; }
  }
  float s=clamp(best,0.,1.), sd=s*s*(3.-2.*s);
  vec3 gr=6.*s*(1.-s)*4.4*rb/(kb*kb*cs);                       // gradient of the dome (toward its centre)
  vec3 g=gr-N*dot(N,gr);
  N=normalize(N-g*.45*cs*w);                                   // each crown bulges: its sun side lit, its far side shaded
  float lc=length(rb);
  float un=lc>1e-4?smoothstep(.1,.8,rb.y/lc):0.;              // the crown centre lies above: its underside
  float su=dot(gr,uSun)*cs;                                    // the centre lies toward the sun: the crown's own shadow side
  // (r9m) uSL.x = the gap / dome-edge floor (.6, URL sl0); the merge keeps the side round's value
  tone*=mix(1.,mix(uSL.x,1.04,smoothstep(.0,.55,sd))*(1.-.28*un*(1.-.6*sd))*(1.-.22*smoothstep(.1,1.6,su))*(.78+.44*cid),w);   // (r9f: crown-to-crown tone .84-1.16 -> .78-1.22)
}
void sideCrowns(vec3 p, inout vec3 N, inout float tone, float w){
  if(w<=.001) return;
  float kf=log2(max(gPix*6./2.8,1.)), k0=floor(kf), fk=smoothstep(.4,1.,fract(kf));
  float cs=2.8*exp2(k0);
  vec3 N0=N; float t0=tone;
  sideCrown1(p,N,tone,cs,w);
  if(fk>0.){ vec3 N1=N0; float t1=t0; sideCrown1(p+11.7,N1,t1,cs*2.,w); N=normalize(mix(N,N1,fk)); tone=mix(tone,t1,fk); }
}
// (r10 canopy) crown clusters at mid / long range (footprint > ~.25 m), in place of the side crowns' scale domes and the facet
// speckle there (flat tilted plates with hard edges: the "reptile skin" on the v5 spurs / v4 hills). Each crown is a rounded
// cap (sphere-like normal: lit top toward the sun, shaded lower flank), crowns of very different sizes grouped in clumps by a
// grove field, dark gaps between the clumps, and each crown's cast shadow on what lies below / behind it (sun ray from the
// visible point tested against the neighbouring crowns). Shading only, on warped 3D cells (works on walls) whose size follows
// the footprint in octaves (>= ~10 px per cell, cross-faded: no shimmer); soft crown edges (~.3 R).
// out: N bent, tone (albedo factor), shv (sun visibility), cid (crown id for species / warm tint)
float gCCsh=1.;   // (r10 canopy) sun visibility from the unresolved crowns' cast shadows (crownClusters), sun term only
void crownCl1(vec3 p, vec3 N0, out vec3 nO, out float tone, out float shv, out float cid, float cs){

  col+=skyFill(reflect(rd,N),vegL)*F*spec*occ*.6*spk*spk*(1.-.8*vegL*(1.-max(NdL,0.)))*mix(vec3(1.),vec3(.95,.9,.7),vegL*uFXb.w);   // (r9f) foliage sky sheen less teal (fb3, 1): no mint frost on the palm fronds   // foliage: most of the sky sheen is shadowed by other leaves (no blue-grey frost on shaded leaves)
  col+=sheen;

// cheap terrain colour for water reflections
vec3 terrainCheap(vec3 pos){
  vec2 p=pos.xz; float e=2.;
  vec3 N=normalize(vec3(H(p-vec2(e,0))-H(p+vec2(e,0)),2.*e,H(p-vec2(0,e))-H(p+vec2(0,e))));
  vec4 vm=VEG(p);

// ---------------------------------------------------------------- water shading
// sky + clouds as seen in reflections (sun handled by the microfacet term); rough water sees softer clouds
vec3 skyRefl(vec3 rd, float rough){
  vec3 c=skyCol(rd);
  // marine haze: the sky just above the sea horizon is a pale, almost white band
  c=mix(c,vec3(.74,.79,.85)*(.9+.1*rd.y),(1.-smoothstep(.0,.3,rd.y))*.32);   // (r7w: was .45 -- the near water of the boat views read pale grey-mint)

    vec2 cp=rd.xz/rd.y*1800.+vec2(uTime*4.,uTime*1.5);
    vec2 wq=cp*.0006; wq+=vec2(fbm(wq*1.3,3),fbm(wq*1.3+3.3,3))*.45;
    float bl=clamp(rough*5.+.3,0.,1.);   // (r8w: +.3 -- near ripples swing the reflected ray across sharp cloud edges: jagged white slivers in v2)
    float cl=(bl>.6?fbm(wq,2):fbm(wq,4))*.5+.5;                  // rough water: only the broad cloud shapes survive
    // low clouds seen in a grazing reflection are far and hazy: they fade into the horizon haze
    float cov=smoothstep(.48-.15*bl,.68+.22*bl,cl)*smoothstep(.006,.12,rd.y);
    // (r7w) a steep reflection (the open sea seen from the air) blurs the broad cloud field into the blue: no grey-purple
    // blotches over the deep water
    c=mix(c,vec3(.95,.96,.97)*1.2,cov*.5*(1.-.65*bl)*(1.-.6*smoothstep(.45,.68,rd.y)));   // (r7w: .62 -> .5, the boat views' near water read pale; r8w: the fade starts at R.y .45, was .3 -- mid reflections (v2 near water) keep the photo's silver cloud patches)
  }
  // (r5) the sea reflects a blurred mix of the whole sky lobe (haze, cloud, blue): a little less saturated than the sky
  // itself -- silver glints and teal faces instead of a uniformly blue "liquid metal" sheen
  // (r7w) ... except for steep reflections (seen from the air): they keep the saturated blue of the high sky -- every
  // aerial photo shows the open sea as a deep navy with its red channel near zero (r6b: 38,78,116 vs photo 11,80,119)
  // (r8w) low / mid reflections (the boat views' near water: R.y .1-.55) back to the r6b .72: v2 near water read a
  // saturated cobalt (C24 h267 vs photo C17 h247); steep aerial reflections (R.y > .7) keep the navy
  return mix(vec3(dot(c,vec3(.3,.55,.15))),c,mix(.48,1.,smoothstep(.35,.8,rd.y)));   // (r8f: .68 -> .6: v2 near water still C20 h260 vs photo C14 h246; r9w: .6 -> .48, C19 h259)
}
// (r8w) sun sparkle seen from the air: the glints of the unresolved short waves are tiny facets -- a sparse field of
// points (cells of 2.5 m, one facet each, glinting for ~1/4 of a 2.3 s cycle), each a 12 cm disc convolved with the pixel
// footprint (radius sf): sub-pixel points light a pixel by their area share, so nothing aliases or crawls in motion.
// Mean 1 (it redistributes the smooth glitter sheen into points; far away it converges back to the sheen).
float sparkle(vec2 p, float sf){
  const float CSZ=3.5, RP=.12;
  vec2 q=p/CSZ, iq=floor(q-.5);
  float r2=RP*RP+sf*sf, s=0.;
  // clustered (~40 m patches of active short waves: gusts / wave groups), not an even star field
  float cl=.15+1.7*smoothstep(-.3,.4,fbm(p*.025+vec2(uTime*.01,4.2),2));
  for(int j=uZero;j<2;j++) for(int i=uZero;i<2;i++){
    vec2 c=iq+vec2(i,j);
    vec3 hh=hash33(vec3(c,3.7));
    float ph=fract(uTime*.3+hh.z);   // (r8f) slower, softer twinkle (3.3 s cycle, a smooth ~45 % pulse; was a 2.3 s flash, lit ~1/4): no flickering snow in flight
    float tw=smoothstep(0.,.25,ph)*smoothstep(.6,.32,ph);
    vec2 o=(c+.1+.8*hh.xy-q)*CSZ;
    float am=fract(hh.x*17.3+hh.y*3.1); am=am*am*am*4.;   // facet size / tilt: most glints faint, a few bright (mean 1)
    s+=tw*am*exp(-dot(o,o)/r2);
  }
  return mix(s*cl*(RP*RP/r2)/(.335*PI*RP*RP/(CSZ*CSZ)),1.,smoothstep(.22,.5,sf/CSZ));   // (r8f: .22 -> .335 = the new pulse's mean)   // (far: the points merge into their mean)
}
// (r13w) patch reef seen from the air: a granular field of coral heads / boulders and sand pockets (~1.5-5 m), dense in the cluster
//  cores (dn -> 1), single grains at the edges (dn -> 0): a thresholded noise whose threshold follows the cluster density. Footprint-
//  filtered: the fine octaves fade and the threshold edge widens with the bed footprint bpx (m), so far away it is a smooth cover.
float reefGrain(vec2 q, float dn, float bpx){
  float fk=clamp(1.3-bpx*.5,0.,1.), fk2=clamp(1.3-bpx*1.4,0.,1.);
  float g=fbm(q*.26+vec2(3.1,7.7),3)*(.55+.45*fk)+.28*vnoise(q*.85+1.3)*fk2;
  float th=mix(.42,-.4,dn), hw=.05+.3*(1.-fk);
  return smoothstep(th-hw,th+hw,g);
}
// (r13 fix, wk47) the same heads with softer rims (~2x the edge width): seen from the air they blur into the cluster, no cut-out spots
float reefGrainS(vec2 q, float dn, float bpx){
  float fk=clamp(1.3-bpx*.5,0.,1.), fk2=clamp(1.3-bpx*1.4,0.,1.);
  float g=fbm(q*.26+vec2(3.1,7.7),3)*(.55+.45*fk)+.28*vnoise(q*.85+1.3)*fk2;
  float th=mix(.42,-.4,dn), hw=.11+.3*(1.-fk);
  return smoothstep(th-hw,th+hw,g);
}
// open-sea whitecaps: sparse breaking crests (~1 % cover at 9-10 m/s), most of them small, a few large. Each is a
// compact bright head (elongated along the crest, i.e. across the wind) with a long thin fading streak of old
// foam trailing upwind -- seen from the air as sparse white flecks drawn out in the wind direction. Cells of
// 46 x 23 m (along x across the wind) hold at most one whitecap. Sub-pixel: replaced by the mean coverage.
// Returns (foam density, foam age).
float gWcC=0.;   // (r8w) whitecap area cover (for the direct composite at aerial footprints)
vec2 whitecaps(vec2 p, float pix, float act, float pixM){
  gWcC=0.;
  if(act<=.01) return vec2(0.,1.);
  vec2 sd=normalize(uShore+vec2(1e-4)); float ca=cos(.35), sa=sin(.35);
  vec2 wd=vec2(sd.x*ca-sd.y*sa,sd.x*sa+sd.y*ca), wn=vec2(-wd.y,wd.x);
  const vec2 CS=vec2(26.,13.);
  vec2 q=vec2(dot(p,wd),dot(p,wn))/CS+vec2(uTime*.3/CS.x,0.);
  vec2 iq=floor(q), fq=fract(q);
  float d=0., ag=1.;
  for(int j=uZero-1;j<=1;j++) for(int i=uZero-1;i<=1;i++){
    vec2 c=iq+vec2(i,j);
    vec3 hh=hash33(vec3(c,17.3));
    if(hh.z>.5*act) continue;
    vec2 o=(vec2(i,j)+.15+.7*hh.xy-fq)*CS;                  // metres to this whitecap's centre
    vec3 h2=hash33(vec3(c,5.1));
    float sz=(.25+1.15*h2.x*h2.x*h2.x)*mix(1.,uWK2.x,smoothstep(.3,.8,pix)), age=h2.y;   // (r10w: x uWK2.x (URL wk4) at aerial footprints: no 6-10 px white "fish" in v9)            // mostly small, a few big ones (r8w: max 2.2 -> 1.4 m: seen from the air the photos show flecks of 1-3 m, no 10 m dashes)
    vec2 l=-o/sz; l.y+=l.x*(h2.z-.5)*.35;                  // local: x downwind, y along the crest
    l+=vec2(vnoise(l*.7+c*3.1),vnoise(l*.7+c*5.7))*.8;     // ragged outline
    // a streak drawn out in the wind (fresh: short and dense; older: long, thin, broken into flecks)
    float L=1.8+2.6*age+1.2*h2.z, W=1.-.35*age;
    float brk=smoothstep(-.3,.4,vnoise(vec2(l.x*.9,l.y*.3)+c*7.7)+.5-age*.6);   // breaks along the streak
    // (r8w) footprint-filtered AREA cover: each part convolved with the pixel footprint (radius sf). A whitecap narrower
    // than the pixel lights it by its area share -- a soft point -- instead of a saturated 1-px white dash (the r7 slivers
    // that crawl in motion: their energy was 5-25x too high). Two parts: a compact head of fresh whitewater at the downwind
    // end and a long, thin, translucent streak of older foam trailing upwind (no uniform white dash).
    float sf=pixM*.55;
    vec2 lm=l*sz;
    float rH=sz*(1.05+.3*h2.z), rHW=sz*W*.95, qH=sqrt(rH*rH+sf*sf), qHW=sqrt(rHW*rHW+sf*sf);
    vec2 lh=lm-vec2(sz*L*.55,0.);
    float eH=lh.x*lh.x/(qH*qH)+lh.y*lh.y/(qHW*qHW);
    float rT=sz*L, rTW=sz*W*.55, qT=sqrt(rT*rT+sf*sf), qTW=sqrt(rTW*rTW+sf*sf);
    float e=lm.x*lm.x/(qT*qT)+lm.y*lm.y/(qTW*qTW);
    float cvH=clamp(smoothstep(1.25,.12,eH)*rH*rHW/(qH*qHW)*1.45,0.,1.)*(1.-.55*age);
    float cvT=clamp(smoothstep(1.25,.12,e)*rT*rTW/(qT*qTW)*1.3,0.,1.)*.3*(1.-.35*age)*mix(1.,brk,smoothstep(.1,.5,e+age*.4));
    float cv=max(cvH,cvT);
    if(cv>d){ d=cv; ag=.15+.6*mix(age,1.,cvT/max(cvH+cvT,1e-4)*.6); }
  }
  // far: the mean area cover of the whitecap field (~0.5 % x activity)
  float k=clamp(2.4-pix*.7,0.,1.);
  d=mix(.005*act,d,k);
  gWcC=d;
  // density for foamTex whose coverage C(D)=1-exp(-1.3D^2-.35D) (x .9 for old foam) equals this cover
  float an=mix(.8,ag,k), X=-log(1.-clamp(d/mix(1.,.9,an),0.,.85));
  return vec2((sqrt(.1225+5.2*X)-.35)/2.6,an);
}
// one cascade lookup with an explicit (anisotropic) pixel footprint
void oSamp(sampler2D tD, sampler2D tS, vec2 uv, vec2 gx, vec2 gy, out vec4 d, out vec4 s){ d=textureGrad(tD,uv,gx,gy); s=textureGrad(tS,uv,gx,gy); }
float gDbgW=0.;   // (r8f) debug channel (URL aout=2/3)
// (r10w) mean of exp(-x/s) over the water part of a footprint [w - f/2, w + f/2] (f: the pixel's extent along the shore
//  distance): bands narrower than the pixel light it by their share instead of being point-sampled (no row-by-row toggling)
float expAvg(float w, float s, float f){ if(f<.05*s) return exp(-w/s); float a=max(w-.5*f,0.), b=w+.5*f; return s*(exp(-a/s)-exp(-b/s))/max(b-a,1e-4); }

  float pixL=max(length(gx),length(gy)), pixS=min(length(gx),length(gy)), pixG=sqrt(pixL*pixS);   // footprint axes (m)

           +textureGrad(uOD1,p*OB_SC/uOL.y+OB_OFF,gx*OB_SC/uOL.y,gy*OB_SC/uOL.y).xz*bw.y)*gust)*g
           +(textureGrad(uOD2,p/uOL.z,gx/uOL.z,gy/uOL.z).xz*bw.y+textureGrad(uOD2,p*OB_SC/uOL.z+OB_OFF.yx,gx*OB_SC/uOL.z,gy*OB_SC/uOL.z).xz*bw.x)*gust*g2;

function coastSDF(S, nSeg, N) {

// (r9 terrain) URL hdump=1&hi=I&hj=J: offline height read-back. The canvas (W x H) gets hTex texels [I, I+W) x [J, J+H/2)
// in its lower half and massif() (eroded field before landH) of the same texels in its upper half, as 24-bit
// (h+200)*1000 in RGB. Generation only: no render shader, no ray march (GPU-cheap).
async function hdumpPass() {
  const P = prog(GLSL_COMMON + TERRAIN_FUNCS + `
uniform sampler2D uH, uB, uE; uniform vec4 uRect, uDom; uniform ivec2 uOff; uniform int uHalf; uniform float uHres;
out vec4 o;
float massif(vec2 p){
  float b=textureLod(uB,(p-uRect.xy)*uRect.w,0.).r;
  vec2 uv=(p-uDom.xy)/uDom.z;
  float m=smoothstep(0.,.05,min(min(uv.x,uv.y),min(1.-uv.x,1.-uv.y)));
  return m>0.?mix(b,texBicubic(uE,uv).r,m):b;
}
void main(){
  ivec2 ic=ivec2(gl_FragCoord.xy); bool top=ic.y>=uHalf; if(top) ic.y-=uHalf;
  ivec2 t=ic+uOff;
  float v=top?massif(uRect.xy+(vec2(t)+.5)*uRect.z/uHres):texelFetch(uH,t,0).r;
  float q=floor(clamp((v+200.)*1000.,0.,16777215.));
  float r=floor(q/65536.), g=floor((q-r*65536.)/256.), b=q-r*65536.-g*256.;
  o=vec4(r,g,b,255.)/255.;
}`);
  gl.useProgram(P.p);
  bindTex(0, world.hTex); gl.uniform1i(P.u.uH, 0); bindTex(1, world.bTex); gl.uniform1i(P.u.uB, 1); bindTex(2, world.eTex); gl.uniform1i(P.u.uE, 2);
  gl.uniform4f(P.u.uRect, RECT[0], RECT[1], RECT[2], 1 / RECT[2]); gl.uniform4f(P.u.uDom, SPLR[0], SPLR[1], SPLR[2], SPLR[2] / num('en', 1024));
  gl.uniform2i(P.u.uOff, num('hi', 0), num('hj', 0)); gl.uniform1i(P.u.uHalf, cv.height >> 1); gl.uniform1f(P.u.uHres, HRES);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, cv.width, cv.height); gl.drawArrays(gl.TRIANGLES, 0, 3);
}
async function main() {
  if (Q.has('hdump')) { cv.width = Math.round(innerWidth); cv.height = Math.round(innerHeight); await generate(); hdumpPass(); await gpuWait(); window.__ready = true; await postFrame(0); return; }
  const TC0 = performance.now();
  pr = prog(FS_RENDER); pp = prog(FS_POST); pbr = prog(FS_BRIGHT); pbl = prog(FS_BLUR);
  console.log('render compiled ms', (performance.now() - TC0).toFixed(0));
  await generate();
  oceanInit();
  cv.width = Math.round(innerWidth); cv.height = Math.round(innerHeight);
  const RS = num('rs', 1); resize(Math.round(cv.width * RS), Math.round(cv.height * RS));
  if (MODE === 'still') document.getElementById('load').remove();
  else { document.getElementById('load').style.opacity = 0; setTimeout(() => document.getElementById('load').remove(), 700); }
  if (MODE === 'still') {
    const spp = num('spp', 16); const TR = performance.now();
    const cam = stillCam(), t = num('t', 3.0);
    oceanUpdate(t);
    clearAcc();
    for (let i = 0; i < spp; i++) {
      renderSample(cam, t, spp > 1 ? jitter(i) : [0, 0], true);
      await gpuWait();   // never queue more than one sample of GPU work
    }
    present();
    await gpuWait();
    console.log('render done ms', (performance.now() - TR).toFixed(0));
    window.__ready = true;
    if (Q.has('post')) await postFrame(0);
  } else {
    await readGround();
    startDrone();
  }
}
main().catch((e) => { console.error(e.stack || e); if (Q.has('post')) fetch('/log', { method: 'POST', body: 'FATAL ' + e.message }); const lt = document.getElementById('loadtxt'); if (lt) lt.textContent = 'Error: ' + e.message; });
</script>
